# v8 in-loop 假完成 gate — REAL litellm_jah action guard arm (note + redo), S0 offline rollout validation.
# Identical suite / s1_cache / models to the control (v8_decomp_n300, 264/300) and the direct-override
# force-field arm (v8_decomp_n300_ff, 298/300), EXCEPT pre_action_gate.mode: litellm_jah. Instead of the
# research harness's direct override (force the ask_user), the irreversible-action decision is made by the
# ACTUAL litellm_jah JahPostCall action guard: when the 27B decision backend flags an irreversible action
# risky AND >=2 customer stonewalls are in the history, the guard emits its force note and the harness re-calls
# the 27B worker to re-decide (note + redo -- the agent is nudged, never forced). Expected to recover FEWER
# than the 298 direct-override (it lets the agent re-decide rather than forcing the ask).
name: v8_failure_decomp_pa_litellm_jah
suite:
  name: jevgym
  n: 300
  seed0: 42
  families: v2
  distractor_style: near
  n_distractors: 12
  noise_lines: 20
  strict: true
n_tasks: 300
small_llm:
  provider: openai
  model: Qwen/Qwen3.8-27B
  base_url: http://127.0.0.1:8000/v1
  api_key: sk-1234
  temperature: 0
llm:
  provider: openai
  model: Qwen/Qwen3.8-27B
  base_url: http://127.0.0.1:8000/v1
  api_key: sk-1234
  temperature: 0
s1_cache: cache/s1_v8_decomp_pa.sqlite
s1_backends:
  v8:
    type: jev
    name: AgentDecision-4B
    base_url: http://127.0.0.1:8000
    model: AgentDecision-4B
    api_key: sk-1234
    price_model: AgentDecision-4B
    timeout: 60.0
workers: 2
arms:
- name: v8_pa_litellm_jah
  s1: v8
  tool_select:
    mode: replace
    extra:
      pre_action_gate:
        enabled: true
        mode: litellm_jah
        irreversible: [cancel_order, refund, ship_order]
        stonewall_min: 2
        max_redos: 2
        tau: 0.3
  routing:
    mode: replace
  finish:
    mode: replace
