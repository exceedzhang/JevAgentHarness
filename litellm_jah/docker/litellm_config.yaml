model_list:
- model_name: jah-auto
  litellm_params:
    model: auto_router/complexity_router
    complexity_router_config:
      classifier_type: custom
      classifier_plugin: litellm_jah.classifier.jah_classifier
      classifier_plugin_timeout_ms: 9000
      tiers:
        COMPLEX: [jah-strong]
        SIMPLE: [jah-fast]
      default_model: jah-strong
      # on classifier error/timeout, route the default model — not the built-in heuristic scorer
      # (litellm 1.106.x defaults to classifier_fallback: heuristic, which can land a
      # "simple"-looking prompt on the fast tier and break the strong-on-failure invariant)
      classifier_fallback: default_model
- model_name: jah-strong
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_key: os.environ/DASHSCOPE_API_KEY
    api_base: https://cn-beijing.maas.qianwenaiapi.com/compatible-mode/v1
    max_tokens: 393216 # model max output 393K (the [1, 393216] cap from maas); default when the client sends none
  # real model limits: with LITELLM_MODIFY_PARAMS=true the proxy clamps a client
  # max_tokens above 393216 down to it (prompts are never truncated)
  model_info:
    max_input_tokens: 1048576 # context 1M
    max_output_tokens: 393216 # max output 393K
- model_name: jah-fast
  litellm_params:
    # self-hosted on the GPU box, same server as the decision model, reached through
    # the existing ssh tunnel (probe 2026-11-07: tool calls + usage work; /v1/models
    # advertises max input/output 262144)
    model: openai/Qwen/Qwen3.8-27B
    api_key: os.environ/DECISION_API_KEY # tunnel-local key, same server as the decision model
    api_base: http://ssh-tunnel:8000/v1
    max_tokens: 131072 # keep the current client default (2^17); the model itself allows 262144
  # real model limits: with LITELLM_MODIFY_PARAMS=true the proxy clamps a client
  # max_tokens above 262144 down to it (prompts are never truncated)
  model_info:
    max_input_tokens: 262144 # advertised by the server's /v1/models
    max_output_tokens: 262144

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY  # generated at startup if unset (see docker/jah_entrypoint.sh)

litellm_settings:
  callbacks:
    - litellm_jah.precall.jah_pre_call
    - litellm_jah.postcall.jah_post_call
    - litellm_jah.logger.jah_step_logger
