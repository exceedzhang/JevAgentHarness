# litellm config for the JevGym / customer-support force-field, side-by-side on host port 4001.
#
# Both tiers (jah-strong + jah-fast) are the 27B (vllm-openai-0), so the router's strong/fast split is
# cosmetic - the 27B is both the worker and the action decision model. The force-field itself lives in the
# postcall action guard (see jah-config.yaml). The 3 JAH callbacks are unchanged from the stock image.
model_list:
- model_name: jah-auto
  litellm_params:
    model: auto_router/complexity_router
    complexity_router_config:
      classifier_type: custom
      classifier_plugin: litellm_jah.classifier.jah_classifier
      classifier_plugin_timeout_ms: 9000
      tiers:
        COMPLEX: [jah-strong]
        SIMPLE: [jah-fast]
      default_model: jah-strong
      # on classifier error/timeout, route to the default model - not the built-in heuristic scorer
      classifier_fallback: default_model
- model_name: jah-strong
  litellm_params:
    # the 27B, reached directly on the existing stack's network (vllm-openai-0), no ssh tunnel
    model: openai/Qwen/Qwen3.8-27B
    api_key: os.environ/DECISION_API_KEY
    api_base: http://vllm-openai-0:8000/v1
    max_tokens: 131072
    model_info:
      max_input_tokens: 262144      # advertised by the 27B server
      max_output_tokens: 262144
- model_name: jah-fast
  litellm_params:
    model: openai/Qwen/Qwen3.8-27B
    api_key: os.environ/DECISION_API_KEY
    api_base: http://vllm-openai-0:8000/v1
    max_tokens: 131072
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 262144

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # generated at startup if unset (see docker/jah_entrypoint.sh)

litellm_settings:
  callbacks:
    - litellm_jah.precall.jah_pre_call
    - litellm_jah.postcall.jah_post_call
    - litellm_jah.logger.jah_step_logger
