# JAH config for the distributed image, pre-wired for the demo on the maas endpoints
# (decision-model-preview, deepseek-v4.1-flash): the vendor URLs and the model names below
# are examples, not defaults.
#
# Mount your own config and point LITELLM_JAH_CONFIG at it to customize.
decision:
  type: jev
  provider: local # explicit model/base_url/key_env below override the provider defaults
  model: AgentDecision-4B # self-hosted decision model, served through the ssh-tunnel container
  base_url: http://ssh-tunnel:8000 # the backend appends /v1/systemone (ssh tunnel to the GPU box)
  key_env: DECISION_API_KEY # read at call time; compose defaults it to the tunnel key (sk-1234)
  price_per_m: 0 # self-hosted: no per-call API price to book (was the maas free-preview model)
  # The deployed 4B has a 4096-token context (measured: HTTP 400 ContextWindowExceeded on two long Chinese steps,
  # 2026-11-05 14:59) and the card's server truncates the prompt to its last tokens, which is also what training
  # used. The state is therefore cut to its tail within this budget (CJK ~1 token/char, ASCII ~1/3), leaving room
  # for the ~250-token question. English states (median 5.4k chars) pass un-truncated.
  max_state_tokens: 2800
  # The card's calibration.json (JevAgentHarness/AgentDecision-4B). Our ssh-tunnel server answers raw T=1
  # probabilities (probed on the live endpoint), so the plugin applies the temperatures itself:
  # p' ∝ p^(1/T) per <kind>:<bucket>, `global` the fallback (see docs/calibration-proposal.md).
  # With this block taus are read in the calibrated space; taus fitted earlier on 4B/raw rows (jah fit
  # 11-04/11-05) are NOT comparable - decisions rows carry model x calibrated so the fit eras cut apart.
  # The quoted keys are not a YAML 1.1 `off`-style necessity ("noul:2" parses as a string unquoted too);
  # quotes are used for visibility. choice:6-16 was re-fit on the new model (GRPO, era >= 2026-11-11 18:00,
  # 251 tool_select gold rows): 2.508 flattens the overconfident adapter (NLL 2.89->2.05, Brier 1.06->0.84).
  # Safe rollout: global stays 0.772, so routing/stop (no new-era gold) keep their current firing; only
  # tool_select (6-16) moves to the re-fit temperature.
  calibration:
    global: 0.7720006824268275
    buckets:
      "noul:2": 0.4230827372940139
      "choice:17-52": 0.05000000000004328 # unreachable in the plugin (asks never offer > 16 options)
      "choice:3-5": 0.9676007232026532
      "choice:6-16": 2.508204
# 0.75 was the preview-model fit. On AgentDecision-4B calibrated (era from 2026-11-05 17:01) the p_hard
# distribution shifted right (median 0.63 -> 0.73): 0.75 fired 47% vs preview's 35%. 0.80 restores the
# preview-era acting strength (fires ~37%, ~-9% daily cost); 0.85 -> 26% fires / -19% cost if we accept
# more mid-probability steps on fast without intermediate protection. Quantiles: p50 .725 p60 .785 p70 .835.
#
# 11-11 18:00 the decision model was updated (new AgentDecision-4B weights, same calibrated era name).
# Its p_hard is sharper/higher (median 0.81, p90 0.98): at 0.80 it now fires 50% instead of the ~37%
# design target. 0.85 restores that strength (fires ~39.5%, per `jah fit --since 2026-11-11 18:00`).
tau: 0.85
mode: cascade
on_error: strong
first_steps_strong: 1
strong_label: COMPLEX
fast_label: SIMPLE
log_dir: ~/.jah/litellm-logs
# the decision rows then also carry the exact state string sent to the decision model: point + state +
# question + options is a complete prompt, and `python -m jevharness.training.data_v2` turns the labelled
# rows into GRPO/SFT training data (see research/docs/DECISION_DATA_V2.md)
log_decision_state: true
model_name: jah-auto
# Decision points. Both label-collecting points are off on evidence from `jah fit` (see each comment);
# routing stays in cascade mode with the tau below, and the strong-tier re-run credentials stay configured
# for any future guard/strong mode. Nothing is collected for `jah fit` right now: switch a point back to
# {mode: "shadow"} to restart labelling (quoted strings only - YAML 1.1 reads a bare off/on as booleans).
decisions:
  # tool_select: back in shadow for GRPO training-data collection (the state is now logged, so labelled rows
  # become training examples - research/docs/DECISION_DATA_V2.md). The fit verdict stands: no tau reached the
  # 95% agreement target, so the point must stay out of guard/trigger mode; shadow only labels.
  # max_options: the AgentDecision-4B card caps next_tool at 26 options (HTTP 400 above); 27/53-tool sessions
  # produced 72 such errors on 11-07/08, so the knockout (two-round chunked ask) kicks in from 27 tools up.
  tool_select: {mode: "shadow", max_options: 26}
  # stop is off on purpose: on AgentDecision-4B calibrated (81 labelled decisions) it agrees with the strong
  # verdict on 61.7% of final replies and no tau reached the 95% target - and in shadow the strong redo's reply
  # was discarded anyway, so the mode bought labels, not protection, at the price of one strong call on every
  # fast final answer (~6% of steps, the whole transcript) plus ~0.24 s. Protection on early stops would be
  # stop: {mode: strong} - not recommended: the fit says the decision model disagrees with the redo too often.
  stop: {mode: "off"}
# strong-tier re-run credentials (finish check / guard redos): the plugin's direct
# litellm.acompletion calls cannot see the deployment's api_key, so name it here
# (os.environ/NAME is read at call time, so the key stays out of the config)
# the finish-check / guard re-run model (litellm SDK name; the endpoint comes from
# strong_api_base below). Without it the re-run is skipped (effect: error_kept) and the
# stop shadow rows never get their done/not_done labels.
strong: openai/deepseek-v4.1-flash
strong_api_key: os.environ/DASHSCOPE_API_KEY
strong_api_base: https://cn-beijing.maas.qianwenaiapi.com/compatible-mode/v1
# Per-model prices for the step log's cost column, in the billing currency per million
# tokens (billed in CNY here, so the cost_usd column is CNY). `cached_input` is the cache-hit
# input price and `cache_write` the explicit cache-creation price (both optional).
# the billing currency of `prices` and the step log's cost columns
currency: CNY
prices:
  deepseek-v4.1-flash: {input: 2, output: 8, cached_input: 0.2}
  qwen3.8-flash: {input: 0.8, output: 2.7, cached_input: 0.1, cache_write: 1.25} # the pre-11-07 fast tier (history re-fit)
  # self-hosted on the GPU box: no per-token bill, booked at zero so step rows stay priced
  "Qwen/Qwen3.8-27B": {input: 0, output: 0, cached_input: 0}
