# JAH config for the distributed image, pre-wired for the demo on the maas endpoints
# (decision-model-preview, deepseek-v4.1-flash): the vendor URLs and the model names below
# are examples, not defaults.
#
# Mount your own config and point LITELLM_JAH_CONFIG at it to customize.
decision:
  type: jev
  provider: local # explicit model/base_url/key_env below override the provider defaults
  model: AgentDecision-4B # self-hosted decision model, served through the ssh-tunnel container
  base_url: http://ssh-tunnel:8000 # the backend appends /v1/systemone (ssh tunnel to the GPU box)
  key_env: DECISION_API_KEY # read at call time; compose defaults it to the tunnel key (sk-1234)
  price_per_m: 0 # self-hosted: no per-call API price to book (was the maas free-preview model)
  # The deployed 4B has a 4096-token context (measured: HTTP 400 ContextWindowExceeded on two long Chinese steps,
  # 2026-11-05 14:59) and the card's server truncates the prompt to its last tokens, which is also what training
  # used. The state is therefore cut to its tail within this budget (CJK ~1 token/char, ASCII ~1/3), leaving room
  # for the ~250-token question. English states (median 5.4k chars) pass un-truncated.
  max_state_tokens: 2800
  # The card's calibration.json (JevAgentHarness/AgentDecision-4B). Our ssh-tunnel server answers raw T=1
  # probabilities (probed on the live endpoint), so the plugin applies the temperatures itself:
  # p' ∝ p^(1/T) per <kind>:<bucket>, `global` the fallback (see docs/calibration-proposal.md).
  # With this block taus are read in the calibrated space; taus fitted earlier on 4B/raw rows (jah fit
  # 11-04/11-05) are NOT comparable - decisions rows carry model x calibrated so the fit eras cut apart.
  # The quoted keys are not a YAML 1.1 `off`-style necessity ("noul:2" parses as a string unquoted too);
  # quotes are used for visibility. choice:6-16 has no bucket on the card, so <=16-option asks get `global`.
  calibration:
    global: 0.7720006824268275
    buckets:
      "noul:2": 0.4230827372940139
      "choice:17-52": 0.05000000000004328 # unreachable in the plugin (asks never offer > 16 options)
      "choice:3-5": 0.9676007232026532
tau: 0.75
mode: cascade
on_error: strong
first_steps_strong: 1
strong_label: COMPLEX
fast_label: SIMPLE
log_dir: ~/.jah/litellm-logs
model_name: jah-auto
# Labelled-decision collection for `jah fit`: shadow mode asks each point and logs the
# answer next to what the agent actually did, without changing the request. stop:shadow
# still re-runs a fast final reply on the strong tier (same as verify_finish) - that redo's
 # outcome is the stop label. The decision model's input is free, so collection adds no billed cost.
# Once a point has >= 30 labelled decisions, `jah fit ~/.jah/litellm-logs` fits its tau.
decisions:
  # tool_select is off on purpose: fitted on 344 labelled decisions, no tau reached the 95%
  # agreement target (best 18%); the model predicts "reply without tool" on 77% of steps where
  # the agent calls one, so acting on it would suppress tool use. Revisit only with a new model.
  tool_select: {mode: "off"}
  stop: {mode: shadow}
# strong-tier re-run credentials (finish check / guard redos): the plugin's direct
# litellm.acompletion calls cannot see the deployment's api_key, so name it here
# (os.environ/NAME is read at call time, so the key stays out of the config)
# the finish-check / guard re-run model (litellm SDK name; the endpoint comes from
# strong_api_base below). Without it the re-run is skipped (effect: error_kept) and the
# stop shadow rows never get their done/not_done labels.
strong: openai/deepseek-v4.1-flash
strong_api_key: os.environ/DASHSCOPE_API_KEY
strong_api_base: https://cn-beijing.maas.qianwenaiapi.com/compatible-mode/v1
# Per-model prices for the step log's cost column, in the billing currency per million
# tokens (billed in CNY here, so the cost_usd column is CNY). `cached_input` is the cache-hit
# input price and `cache_write` the explicit cache-creation price (both optional).
# the billing currency of `prices` and the step log's cost columns
currency: CNY
prices:
  deepseek-v4.1-flash: {input: 2, output: 8, cached_input: 0.2}
  qwen3.8-flash: {input: 0.8, output: 2.7, cached_input: 0.1, cache_write: 1.25}
